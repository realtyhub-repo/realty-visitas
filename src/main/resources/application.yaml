spring:
  application:
    name: visitas

  datasource:
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    url: ${POSTGRES_URL}


  jpa:

    hibernate:
        ddl-auto: validate

    show-sql: true
    properties:
       hibernate:
         dialect: org.hibernate.dialect.PostgreSQLDialect

server:
    port: 8085
