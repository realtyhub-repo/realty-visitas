spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  application:
    name: visitas

  datasource:
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    url: ${POSTGRES_URL}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2s
          multiplier: 2
          max-interval: 30s
          max-retries: 5



  jpa:

    hibernate:
        ddl-auto: validate

    show-sql: true
    properties:
       hibernate:
         dialect: org.hibernate.dialect.PostgreSQLDialect

servicios:
  usuarios-url: ${USUARIOS_URL:http://localhost:8082}

visitas:
  duracion-minutos: 60
  hora-apertura: "08:00"
  hora-cierre: "18:00"

server:
    port: 8085
